<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Main container -->
  <rect x="40" y="40" width="320" height="220" rx="12" fill="white" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Header -->
  <rect x="40" y="40" width="320" height="45" rx="12" fill="#F8FAFC"/>
  <rect x="60" y="55" width="130" height="14" rx="4" fill="#CBD5E1"/>
  <circle cx="310" cy="62" r="8" fill="#6366F1"/>
  <circle cx="335" cy="62" r="8" fill="#E2E8F0"/>

  <!-- Chart grid -->
  <line x1="70" y1="90" x2="340" y2="90" stroke="#F1F5F9"/>
  <line x1="70" y1="130" x2="340" y2="130" stroke="#F1F5F9"/>
  <line x1="70" y1="170" x2="340" y2="170" stroke="#F1F5F9"/>
  <line x1="70" y1="210" x2="340" y2="210" stroke="#F1F5F9"/>

  <!-- Bars -->
  <rect x="90" y="150" width="28" height="60" rx="6" fill="#EEF2FF"/>
  <rect x="130" y="120" width="28" height="90" rx="6" fill="#EEF2FF"/>
  <rect x="170" y="140" width="28" height="70" rx="6" fill="#EEF2FF"/>
  <rect x="210" y="100" width="28" height="110" rx="6" fill="#EEF2FF"/>
  <rect x="250" y="130" width="28" height="80" rx="6" fill="#EEF2FF"/>

  <!-- Bar highlights -->
  <rect x="90" y="150" width="28" height="60" rx="6" fill="#6366F1" opacity="0.25"/>
  <rect x="130" y="120" width="28" height="90" rx="6" fill="#6366F1" opacity="0.4"/>
  <rect x="170" y="140" width="28" height="70" rx="6" fill="#6366F1" opacity="0.3"/>
  <rect x="210" y="100" width="28" height="110" rx="6" fill="#6366F1" opacity="0.55"/>
  <rect x="250" y="130" width="28" height="80" rx="6" fill="#6366F1" opacity="0.35"/>

  <!-- Line chart -->
  <path
    d="M104 160 L144 135 L184 155 L224 115 L264 140"
    stroke="#22C55E"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Line points -->
  <circle cx="104" cy="160" r="4" fill="#22C55E"/>
  <circle cx="144" cy="135" r="4" fill="#22C55E"/>
  <circle cx="184" cy="155" r="4" fill="#22C55E"/>
  <circle cx="224" cy="115" r="4" fill="#22C55E"/>
  <circle cx="264" cy="140" r="4" fill="#22C55E"/>

  <!-- Floating stats card -->
  <g filter="drop-shadow(0 6px 10px rgba(0,0,0,0.12))">
    <rect x="255" y="190" width="115" height="70" rx="10" fill="white" stroke="#E2E8F0"/>
    <rect x="270" y="205" width="60" height="8" rx="4" fill="#6366F1"/>
    <rect x="270" y="220" width="40" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="270" y="235" width="75" height="10" rx="5" fill="#22C55E"/>
  </g>

</svg>
