<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Main Canvas Container (Window Style) -->
<rect x="40" y="40" width="320" height="220" rx="12" fill="white" stroke="#E2E8F0" stroke-width="2"/>

<!-- Header Bar -->

<rect x="40" y="40" width="320" height="45" rx="12" fill="#F8FAFC"/>
<rect x="60" y="55" width="80" height="15" rx="4" fill="#CBD5E1"/>
<circle cx="310" cy="62" r="8" fill="#6366F1"/>
<circle cx="335" cy="62" r="8" fill="#E2E8F0"/>

<!-- Separator -->

<line x1="40" y1="85" x2="360" y2="85" stroke="#E2E8F0" stroke-width="2"/>

<!-- Soft background circle -->

<circle cx="200" cy="165" r="75" fill="#F8FAFC"/>

<!-- Central server stack (Adjusted size/position) -->

<g transform="translate(145, 100) scale(0.92)">
<rect x="0" y="0" width="120" height="38" rx="8" fill="white" stroke="#E2E8F0" stroke-width="2"/>
<rect x="0" y="48" width="120" height="38" rx="8" fill="white" stroke="#E2E8F0" stroke-width="2"/>
<rect x="0" y="96" width="120" height="38" rx="8" fill="white" stroke="#E2E8F0" stroke-width="2"/>

<!-- Server lights -->

<circle cx="18" cy="19" r="4" fill="#22C55E"/>
<circle cx="18" cy="67" r="4" fill="#22C55E"/>
<circle cx="18" cy="115" r="4" fill="#22C55E"/>

<!-- Content indicators -->

<rect x="32" y="16" width="60" height="6" rx="3" fill="#CBD5E1"/>
<rect x="32" y="64" width="60" height="6" rx="3" fill="#CBD5E1"/>
<rect x="32" y="112" width="60" height="6" rx="3" fill="#CBD5E1"/>
</g>

<!-- Calendar (Moved to the right) -->

<g filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))">
<rect x="200" y="215" width="130" height="55" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1"/>
<rect x="200" y="215" width="130" height="15" rx="10" fill="#F8FAFC"/>
<rect x="215" y="240" width="18" height="18" rx="4" fill="#22C55E"/>
<rect x="240" y="240" width="18" height="18" rx="4" fill="#EEF2FF"/>
<rect x="265" y="240" width="18" height="18" rx="4" fill="#EEF2FF"/>
<rect x="290" y="240" width="18" height="18" rx="4" fill="#EEF2FF"/>
</g>

<!-- Status Check Badge (Adjusted to relative calendar position) -->

<g filter="drop-shadow(0 4px 4px rgba(0,0,0,0.1))">
<circle cx="330" cy="225" r="10" fill="#22C55E"/>
<path d="M324 225 L328 229 L336 221" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>