<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Main Canvas Container -->
<rect x="40" y="40" width="320" height="220" rx="12" fill="white" stroke="#E2E8F0" stroke-width="2"/>

<!-- Header Bar -->

<rect x="40" y="40" width="320" height="45" rx="12" fill="#F8FAFC"/>
<rect x="60" y="55" width="80" height="15" rx="4" fill="#CBD5E1"/>
<circle cx="310" cy="62" r="8" fill="#6366F1"/>
<circle cx="335" cy="62" r="8" fill="#E2E8F0"/>

<!-- Separator -->

<line x1="40" y1="85" x2="360" y2="85" stroke="#E2E8F0" stroke-width="2"/>

<!-- Central Focus Area (Simplified Privacy Metaphor) -->

<rect x="100" y="105" width="200" height="140" rx="10" fill="#FFFBEB" opacity="0.5"/>

<!-- Large Key Icon (Yellow/Orange) -->

<g transform="translate(130, 150)">
<!-- Key Head -->
<circle cx="30" cy="20" r="22" stroke="#F59E0B" stroke-width="6" fill="white"/>
<circle cx="30" cy="20" r="8" fill="#F59E0B" opacity="0.2"/>

<!-- Key Shaft -->
<rect x="52" y="16" width="80" height="8" rx="4" fill="#F59E0B"/>

<!-- Key Teeth -->
<rect x="95" y="24" width="10" height="12" rx="3" fill="#F59E0B"/>
<rect x="115" y="24" width="10" height="8" rx="3" fill="#F59E0B"/>


</g>

<!-- Decorative Interface Lines -->

<rect x="130" y="225" width="140" height="4" rx="2" fill="#F59E0B" opacity="0.1"/>
</svg>