<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Main Canvas Container -->
<rect x="40" y="40" width="320" height="220" rx="12" fill="white" stroke="#E2E8F0" stroke-width="2"/>

<!-- Header Bar -->

<rect x="40" y="40" width="320" height="45" rx="12" fill="#F8FAFC"/>
<rect x="60" y="55" width="80" height="15" rx="4" fill="#CBD5E1"/>
<circle cx="310" cy="62" r="8" fill="#6366F1"/>
<circle cx="335" cy="62" r="8" fill="#E2E8F0"/>

<!-- Separator and Grid lines -->

<line x1="40" y1="85" x2="360" y2="85" stroke="#E2E8F0" stroke-width="2"/>
<line x1="200" y1="85" x2="200" y2="260" stroke="#F1F5F9" stroke-width="1"/>

<!-- English Card (Primary) -->

<rect x="65" y="105" width="120" height="60" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1" opacity="0.9"/>
<rect x="75" y="115" width="40" height="6" rx="3" fill="#6366F1" opacity="0.6"/>
<rect x="75" y="127" width="90" height="4" rx="2" fill="#6366F1" opacity="0.2"/>
<rect x="75" y="137" width="70" height="4" rx="2" fill="#6366F1" opacity="0.2"/>
<text x="75" y="155" fill="#6366F1" font-family="sans-serif" font-weight="600" font-size="10">English</text>

<!-- Arabic Card (RTL representation) -->

<rect x="215" y="125" width="120" height="60" rx="8" fill="#F0FDF4" stroke="#22C55E" stroke-width="1" opacity="0.9"/>
<rect x="285" y="135" width="40" height="6" rx="3" fill="#22C55E" opacity="0.6"/>
<rect x="225" y="147" width="100" height="4" rx="2" fill="#22C55E" opacity="0.2"/>
<rect x="245" y="157" width="80" height="4" rx="2" fill="#22C55E" opacity="0.2"/>
<text x="225" y="175" fill="#22C55E" font-family="sans-serif" font-weight="600" font-size="10">العربية</text>

<!-- Spanish Card (Floating) -->

<rect x="130" y="180" width="120" height="60" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1" opacity="0.9"/>
<rect x="140" y="190" width="40" height="6" rx="3" fill="#F59E0B" opacity="0.6"/>
<rect x="140" y="202" width="90" height="4" rx="2" fill="#F59E0B" opacity="0.2"/>
<rect x="140" y="212" width="60" height="4" rx="2" fill="#F59E0B" opacity="0.2"/>
<text x="140" y="230" fill="#F59E0B" font-family="sans-serif" font-weight="600" font-size="10">Español</text>
</svg>