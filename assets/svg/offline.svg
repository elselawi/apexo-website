<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Main Canvas Container -->
<rect x="40" y="40" width="320" height="220" rx="12" fill="white" stroke="#E2E8F0" stroke-width="2"/>

<!-- Header Bar -->

<rect x="40" y="40" width="320" height="45" rx="12" fill="#F8FAFC"/>
<rect x="60" y="55" width="80" height="15" rx="4" fill="#CBD5E1"/>
<circle cx="310" cy="62" r="8" fill="#6366F1"/>
<circle cx="335" cy="62" r="8" fill="#E2E8F0"/>

<!-- Separator -->

<line x1="40" y1="85" x2="360" y2="85" stroke="#E2E8F0" stroke-width="2"/>

<!-- Central Offline Focus Area -->

<rect x="100" y="105" width="200" height="140" rx="10" fill="#F1F5F9" opacity="0.5"/>

<!-- Larger Crossed-out Cloud Icon -->

<g transform="translate(150, 115)">
<!-- Cloud Shape (Upscaled) -->
<path d="M18 60C10.5 60 4.5 54 4.5 46.5C4.5 39.75 9.75 33.75 16.5 33C16.5 24.75 23.25 18 31.5 18C35.25 18 38.25 19.5 40.5 21.75C42.75 16.5 48 12.75 54 12.75C62.25 12.75 69 19.5 69 27.75C69 28.5 69 29.25 68.85 30C73.5 32.25 76.5 36.75 76.5 42C76.5 51.75 69 60 60 60H18Z" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

<!-- Large Red Strike-through (Upscaled) -->
<line x1="0" y1="65" x2="80" y2="5" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>
<!-- Subtle background strike to make it pop -->
<line x1="0" y1="65" x2="80" y2="5" stroke="white" stroke-width="7" stroke-linecap="round" opacity="0.3"/>


</g>

<!-- Decorative Interface Lines -->

<rect x="130" y="215" width="140" height="4" rx="2" fill="#CBD5E1"/>
<rect x="160" y="225" width="80" height="4" rx="2" fill="#CBD5E1" opacity="0.6"/>

<!-- Success Badge (Confirming it works) -->

<g filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))">
<rect x="175" y="90" width="50" height="30" rx="15" fill="white" stroke="#22C55E" stroke-width="1.5"/>
<path d="M192 105L197 110L208 99" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>