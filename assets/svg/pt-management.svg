<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Main container -->
  <rect x="40" y="40" width="320" height="220" rx="12" fill="white" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Header -->
  <rect x="40" y="40" width="320" height="45" rx="12" fill="#F8FAFC"/>
  <rect x="60" y="55" width="110" height="14" rx="4" fill="#CBD5E1"/>
  <circle cx="310" cy="62" r="8" fill="#6366F1"/>
  <circle cx="335" cy="62" r="8" fill="#E2E8F0"/>

  <!-- Table separators -->
  <line x1="40" y1="85" x2="360" y2="85" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="100" y1="85" x2="100" y2="260" stroke="#F1F5F9"/>
  <line x1="220" y1="85" x2="220" y2="260" stroke="#F1F5F9"/>
  <line x1="290" y1="85" x2="290" y2="260" stroke="#F1F5F9"/>

  <!-- Row 1 -->
  <circle cx="70" cy="115" r="14" fill="#E2E8F0"/>
  <rect x="115" y="108" width="70" height="6" rx="3" fill="#64748B"/>
  <rect x="115" y="118" width="40" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="235" y="108" width="40" height="14" rx="7" fill="#EEF2FF"/>
  <rect x="242" y="112" width="26" height="6" rx="3" fill="#6366F1" opacity="0.6"/>

  <!-- Row 2 -->
  <circle cx="70" cy="155" r="14" fill="#E2E8F0"/>
  <rect x="115" y="148" width="80" height="6" rx="3" fill="#64748B"/>
  <rect x="115" y="158" width="50" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="230" y="148" width="50" height="14" rx="7" fill="#F0FDF4"/>
  <rect x="238" y="152" width="34" height="6" rx="3" fill="#22C55E" opacity="0.6"/>

  <!-- Row 3 (highlighted) -->
  <rect x="40" y="180" width="320" height="40" fill="#6366F1" fill-opacity="0.04"/>
  <circle cx="70" cy="200" r="14" fill="#E2E8F0"/>
  <rect x="115" y="193" width="65" height="6" rx="3" fill="#64748B"/>
  <rect x="115" y="203" width="45" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="230" y="193" width="50" height="14" rx="7" fill="#FFFBEB"/>
  <rect x="238" y="197" width="32" height="6" rx="3" fill="#F59E0B" opacity="0.6"/>

  <!-- Floating patient card -->
  <g filter="drop-shadow(0 6px 10px rgba(0,0,0,0.12))">
    <rect x="250" y="195" width="120" height="75" rx="10" fill="white" stroke="#E2E8F0"/>
    <circle cx="270" cy="215" r="12" fill="#E2E8F0"/>
    <rect x="290" y="208" width="55" height="6" rx="3" fill="#94A3B8"/>
    <rect x="290" y="220" width="35" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="265" y="240" width="90" height="14" rx="6" fill="#6366F1"/>
  </g>

</svg>
